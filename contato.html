<main id="conteudo-principal" data-leitor><i class="d d1"></i><i class="d d2"></i><i class="d d3"></i><div class="wrap"><h1>Contato</h1>

    
    <div class="glass-card contato-card font-mont">
      <p>Você pode entrar em contato conosco por meio dos seguintes meios:</p>
      <a class="mail-link" href="mailto:instruere@gmail.com">instruere7@gmail.com</a>

      
      <div class="social-icons">
        <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" class="social-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor"/></svg>
        </a>
        <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" class="social-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="7.5" y1="10" x2="7.5" y2="17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="7.5" cy="6.7" r="1" fill="currentColor"/><path d="M11.5 17v-4.2c0-1.6 1-2.6 2.4-2.6s2.1 1 2.1 2.6V17" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        </a>
        <a href="mailto:instruere7@gmail.com" aria-label="E-mail" class="social-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 6.5l8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
    </div>

    <form class="contato-form" id="contactForm" novalidate>
      <h3>Ou envie uma mensagem</h3>
      <div class="form-row">
        <label>Nome
          <input type="text" name="nome" placeholder="Seu nome completo" required>
        </label>
        <label>E-mail
          <input type="email" name="email" placeholder="seu@email.com" required>
        </label>
      </div>
      <label>Assunto
        <input type="text" name="assunto" placeholder="Assunto da mensagem">
      </label>
      <label>Mensagem
        <textarea name="mensagem" rows="4" placeholder="Escreva sua mensagem..." required></textarea>
      </label>
      <button type="submit" class="btn-primary">Enviar</button>
      <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
    </form></div><img class="books" src="assets/svg/books.svg" alt="" aria-hidden="true" onerror="this.remove()"></main>

<script>document.getElementById('contactForm').addEventListener('submit',function(e){e.preventDefault();var f=e.target,s=document.getElementById('formStatus');
if(!f.checkValidity()){s.textContent='Preencha nome, e-mail e mensagem.';return}
location.href='mailto:instruere7@gmail.com?subject='+encodeURIComponent(f.assunto.value||'Contato pelo site')+'&body='+encodeURIComponent(f.mensagem.value+'\n\n'+f.nome.value+' ('+f.email.value+')');s.textContent='Abrindo seu e-mail…'})</script> <!-- VLibras - Acessibilidade em Libras -->
